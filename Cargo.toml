[package]
name = "ce-drive-client"
version = "0.1.0"
edition = "2024"
description = "CE Drive client — open a remote drive over the CE mesh by capability, bootstrap a DriveTree replica from the Open snapshot, mirror via Poll + beacon, and list/read/write. An app over CE primitives."
license = "AGPL-3.0-only"
repository = "https://github.com/ce-net/ce-drive"
authors = ["Leif Rydenfalk <ledamecrydenfalk@gmail.com>"]

[lib]
name = "ce_drive_client"
path = "src/lib.rs"

[[bin]]
name = "ce-drive"
path = "src/main.rs"

[dependencies]
# --- CE substrate (siblings in the ~/ce-net workspace; by path) ---
ce-rs = { git = "https://github.com/ce-net/ce-rs" }                            # mesh transport (request) + blobs
ce-iam-core = { git = "https://github.com/ce-net/ce-iam" }
ce-identity = { git = "https://github.com/ce-net/ce" }
ce-drive-core = { git = "https://github.com/ce-net/ce-drive" } # local DriveTree replica for mirroring
ce-drive-serve = { git = "https://github.com/ce-net/ce-drive-serve" }         # the shared ce-drive/v1 wire protocol

# --- async + error + serde ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
hex = "0.4"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
directories = "5"

[dev-dependencies]
tempfile = "3"
proptest = "1"
# In-process CE nodes for the runnable host+access example.
ce-node = { git = "https://github.com/ce-net/ce" }
ce-drive-serve = { git = "https://github.com/ce-net/ce-drive-serve" }

# NO [patch] SECTION, DELIBERATELY — do not reintroduce one. Same story as ce-drive-serve:
# these entries existed to redirect git URLs onto local path copies so the graph collapsed onto ONE
# ce-rs / ce-identity. The deps are git deps on those same URLs now, so cargo unifies them by itself.
# The sweep that converted them rewrote the patch values too, leaving each entry patching a source to
# ITSELF, which cargo rejects outright ("patches must point to different sources") — this repo could
# not be built from a clean checkout. Working-tree sources for local dev come from the generated,
# git-excluded .cargo/config.toml that `tools/ce-dev-link` writes; that is per-machine and does not
# belong in a committed manifest.
